<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-label="Абстрактный постер: геометрический беспилотник над координатной сеткой, декоративное изображение">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0f10"/>
      <stop offset="0.55" stop-color="#1b2425"/>
      <stop offset="1" stop-color="#101516"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#E58D32" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#E58D32" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#E58D32" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#F2F0E9" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="diag" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#E58D32" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#E58D32" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E58D32" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>
  <rect width="1280" height="800" fill="url(#glow)"/>

  <!-- Декоративная диагональная оранжевая линия -->
  <line x1="150" y1="740" x2="1130" y2="60" stroke="url(#diag)" stroke-width="2"/>

  <!-- Угловые прицельные метки -->
  <g stroke="#F2F0E9" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <path d="M36 120h40M56 100v40"/>
    <path d="M1244 120h-40M1224 100v40"/>
    <path d="M36 680h40M56 660v40"/>
    <path d="M1244 680h-40M1224 660v40"/>
  </g>

  <!-- Координатные подписи (декоративные) -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" letter-spacing="2" fill="#838D7B">
    <text x="52" y="92">SYS / LINK</text>
    <text x="1076" y="92">REF 04</text>
    <text x="52" y="756">GRID 55.7</text>
    <text x="1088" y="756">ALT —</text>
  </g>

  <!-- Беспилотник (геометрическая схема, вид сверху) -->
  <g transform="translate(640 372)">
    <!-- Лучи -->
    <g stroke="#F2F0E9" stroke-opacity="0.35" stroke-width="2">
      <line x1="-70" y1="-70" x2="-258" y2="-258"/>
      <line x1="70" y1="-70" x2="258" y2="-258"/>
      <line x1="-70" y1="70" x2="-258" y2="258"/>
      <line x1="70" y1="70" x2="258" y2="258"/>
    </g>

    <!-- Роторы -->
    <g fill="none" stroke="#F2F0E9" stroke-width="2">
      <circle cx="-258" cy="-258" r="64"/>
      <circle cx="258" cy="-258" r="64"/>
      <circle cx="-258" cy="258" r="64"/>
      <circle cx="258" cy="258" r="64"/>
    </g>
    <g fill="none" stroke="#E58D32" stroke-width="1.5" stroke-opacity="0.8">
      <circle cx="-258" cy="-258" r="88"/>
      <circle cx="258" cy="-258" r="88"/>
      <circle cx="-258" cy="258" r="88"/>
      <circle cx="258" cy="258" r="88"/>
    </g>
    <!-- Ступицы -->
    <g fill="#838D7B">
      <circle cx="-258" cy="-258" r="7"/>
      <circle cx="258" cy="-258" r="7"/>
      <circle cx="-258" cy="258" r="7"/>
      <circle cx="258" cy="258" r="7"/>
    </g>

    <!-- Корпус -->
    <rect x="-78" y="-54" width="156" height="108" rx="22" fill="#1b2425" stroke="#F2F0E9" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="-34" y="-24" width="68" height="48" rx="10" fill="#E58D32" fill-opacity="0.16" stroke="#E58D32" stroke-width="1.5"/>

    <!-- Сенсоры -->
    <g fill="#E58D32">
      <circle cx="0" cy="0" r="5"/>
      <circle cx="-56" cy="0" r="4" fill-opacity="0.8"/>
      <circle cx="56" cy="0" r="4" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- Сканирующая линия (декоративная) -->
  <line x1="240" y1="300" x2="1040" y2="300" stroke="#E58D32" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 8"/>
</svg>
